<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .strong{
            height: 570px;
            width: 20%;
            display: flex;  
            flex-direction: column;
        }
        #a{
            
            color: green;
            border: 5px solid red;
            border-radius: 250%;
            height: 100px;
        }
        #b{
            
            color: yellow;
            border: 5px solid yellow;
            border-radius: 250%;
            height: 100px;
        }
        #c{

            color: red;
            border: 5px solid green;
            border-radius: 250%;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="strong">
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
    </div>
</body>
</html>
